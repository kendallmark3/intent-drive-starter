<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" width="1400" height="540" role="img" aria-labelledby="t d">
<title id="t">The Progressive Intent loop</title>
<desc id="d">Intent, Plan, Build, Observe, Validate, Refine, then Continue or Stop. Continue appends a delta and returns to Intent. Stop moves on to review, CI, and ship.</desc>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#23394A" stroke-width="1" opacity="0.55"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C9BB5"/></marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E38B3F"/></marker>
</defs>
<rect width="1400" height="540" fill="#0C1F2E"/>
<rect width="1400" height="540" fill="url(#grid)"/>
<text x="61" y="58" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#6C9BB5">PROGRESSIVE INTENT / THE LOOP</text>
<text x="61" y="104" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#EDE9DD">State what you want. Let the AI figure out how.</text>
<text x="61" y="140" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#8CA0AC">Observe what it produces. Tighten only what needs tightening.</text>
<rect x="61" y="190" width="150" height="150" rx="3" fill="#12293B" stroke="#E38B3F" stroke-width="1.5"/>
<text x="75" y="218" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#E38B3F">N01</text>
<text x="75" y="250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#EDE9DD">Intent</text>
<text x="75" y="276" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8CA0AC">State what</text>
<text x="75" y="294" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8CA0AC">you want</text>
<text x="75" y="326" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#E38B3F">HUMAN</text>
<line x1="218" y1="265.0" x2="242" y2="265.0" stroke="#6C9BB5" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="249" y="190" width="150" height="150" rx="3" fill="#12293B" stroke="#2F4B60" stroke-width="1"/>
<text x="263" y="218" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#6C9BB5">N02</text>
<text x="263" y="250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#EDE9DD">Plan</text>
<text x="263" y="276" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8CA0AC">Find the smallest</text>
<text x="263" y="294" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8CA0AC">useful delta</text>
<text x="263" y="326" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#6C9BB5">AI</text>
<line x1="406" y1="265.0" x2="430" y2="265.0" stroke="#6C9BB5" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="437" y="190" width="150" height="150" rx="3" fill="#12293B" stroke="#2F4B60" stroke-width="1"/>
<text x="451" y="218" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#6C9BB5">N03</text>
<text x="451" y="250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#EDE9DD">Build</text>
<text x="451" y="276" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8CA0AC">Make something</text>
<text x="451" y="294" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8CA0AC">observable</text>
<text x="451" y="326" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#6C9BB5">AI</text>
<line x1="594" y1="265.0" x2="618" y2="265.0" stroke="#6C9BB5" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="625" y="190" width="150" height="150" rx="3" fill="#12293B" stroke="#2F4B60" stroke-width="1"/>
<text x="639" y="218" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#6C9BB5">N04</text>
<text x="639" y="250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#EDE9DD">Observe</text>
<text x="639" y="276" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8CA0AC">Look at the</text>
<text x="639" y="294" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8CA0AC">running result</text>
<text x="639" y="326" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#E38B3F">HUMAN</text>
<line x1="782" y1="265.0" x2="806" y2="265.0" stroke="#6C9BB5" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="813" y="190" width="150" height="150" rx="3" fill="#12293B" stroke="#2F4B60" stroke-width="1"/>
<text x="827" y="218" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#6C9BB5">N05</text>
<text x="827" y="250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#EDE9DD">Validate</text>
<text x="827" y="276" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8CA0AC">Check it against</text>
<text x="827" y="294" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8CA0AC">the evidence</text>
<text x="827" y="326" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#6C9BB5">AI</text>
<line x1="970" y1="265.0" x2="994" y2="265.0" stroke="#6C9BB5" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="1001" y="190" width="150" height="150" rx="3" fill="#12293B" stroke="#2F4B60" stroke-width="1"/>
<text x="1015" y="218" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#6C9BB5">N06</text>
<text x="1015" y="250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#EDE9DD">Refine</text>
<text x="1015" y="276" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8CA0AC">Tighten only what</text>
<text x="1015" y="294" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8CA0AC">needs tightening</text>
<text x="1015" y="326" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#E38B3F">HUMAN + AI</text>
<line x1="1158" y1="265.0" x2="1182" y2="265.0" stroke="#6C9BB5" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="1189" y="190" width="150" height="150" rx="3" fill="#12293B" stroke="#E38B3F" stroke-width="1.5"/>
<text x="1203" y="218" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#E38B3F">N07</text>
<text x="1203" y="250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#EDE9DD">Continue</text>
<text x="1203" y="274" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#EDE9DD">or Stop</text>
<text x="1203" y="300" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8CA0AC">The human decides</text>
<text x="1203" y="326" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#E38B3F">HUMAN</text>
<path d="M1229 346 V392 H136.0 V348" fill="none" stroke="#E38B3F" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ao)"/>
<rect x="487.5" y="379" width="390" height="26" fill="#0C1F2E"/>
<text x="682.5" y="396.5" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1.5" fill="#E38B3F">CONTINUE — APPEND A DELTA, GO AROUND AGAIN</text>
<line x1="1299" y1="346" x2="1299" y2="424" stroke="#6C9BB5" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="899" y="432" width="440" height="40" rx="3" fill="#12293B" stroke="#2F4B60"/>
<text x="1119" y="457" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1.5" fill="#EDE9DD">STOP → REVIEW AGAINST INTENT · CI · SHIP</text>
<line x1="61" y1="488" x2="1339" y2="488" stroke="#23394A"/>
<text x="61" y="514" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1.5" fill="#6C9BB5">REPOSITORY STATE + NEXT INTENT = NEXT REPOSITORY STATE</text>
<text x="1339" y="514" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1.5" fill="#8CA0AC">INTENT-DRIVEN ENGINEERING</text>
</svg>
